[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freedomspeech"
version = "0.1.0"
description = "Python SDK for the Freedom Speech API: Kazakh, Russian and English speech recognition, synthesis, voice cloning and translation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Freedom Speech" }]
requires-python = ">=3.9"
keywords = ["speech", "asr", "tts", "kazakh", "russian", "voice cloning", "freedomspeech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "requests>=2.25",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://freedomspeech.kz"
Documentation = "https://freedomspeech.kz/docs"
Source = "https://github.com/freedomspeechkz/freedomspeech-python"
Issues = "https://github.com/freedomspeechkz/freedomspeech-python/issues"

[project.scripts]
fs = "freedomspeech.cli:main"

[tool.setuptools.packages.find]
include = ["freedomspeech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
